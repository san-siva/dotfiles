set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

run '~/.tmux/plugins/tpm/tpm'

# Two complementary copy paths:
#  - Kitty: hold Shift and drag (copy_on_select). Works even in mouse-grabbing
#    apps (e.g. Claude), but is NOT tmux-pane-aware — kitty sees the raw grid.
#  - tmux mouse drag (no Shift): pane-aware, copies to the clipboard on release
#    via pbcopy (no tmux-yank plugin needed).
setw -g mode-keys vi
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

set-option -g prefix C-a

unbind C-b
unbind C-L

bind-key L send-keys C-l \; clear-history
bind-key C-a send-prefix

bind u switch -p
bind i switch -n
set-option -sg escape-time 10
set-option -g focus-events on
set-option -g history-limit 10000
set-option -g allow-rename off
set -g renumber-windows on
set-option -ga terminal-overrides ",xterm-256color:Tc"

set -g status-bg default
set -g default-terminal "xterm-256color"
set -g mouse on

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind o select-window -n
bind y select-window -p
bind p last-window
bind P switch-client -l

set -g status-style "bg=default"
set -g window-status-format "#[fg=#A6D189] #W #I "
set -g window-status-current-format "#[fg=#303446,bg=#A6D189] #W #I "
set -g status-left ""
set -g status-right "#[fg=#303446,bg=#E78284] #S "
set -g message-style "bg=#e5c890,fg=#303446"
