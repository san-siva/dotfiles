font_family      JetBrainsMono Nerd Font Mono
italic_font      JetBrainsMono Nerd Font Mono ExtraLight Italic
bold_font        JetBrainsMono Nerd Font Mono Light
bold_italic_font JetBrainsMono Nerd Font Mono Light Italic

# Font size (in pts)
font_size        13.0

shell_integration no-cursor
cursor_shape block
cursor_blink_interval     0.5
cursor_stop_blinking_after 5.0
scrollback_lines 2000
scrollback_pager less +G -R
wheel_scroll_multiplier 0.0
click_interval 0.5
select_by_word_characters :@-./_~?&=%+#
mouse_hide_wait 0.0
# Hold Shift and drag to select (bypasses tmux/app mouse grab); copies on release
copy_on_select yes
enabled_layouts *
remember_window_size   no

initial_window_width   150c
initial_window_height  50c
repaint_delay    0
input_delay 0

visual_bell_duration 0.0
enable_audio_bell no
open_url_modifiers ctrl+shift
open_url_with default
term xterm-kitty
window_border_width 1
window_margin_width 0
active_border_color #ffffff
inactive_border_color #cccccc
active_tab_foreground #000
active_tab_background #eee
inactive_tab_foreground #444
inactive_tab_background #999
macos_option_as_alt yes
macos_titlebar_color background
allow_remote_control no

clear_all_shortcuts false
# disable cmd+enter
map cmd+enter no_op

include themes/frappe.conf
